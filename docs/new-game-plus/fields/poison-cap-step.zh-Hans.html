<main>
<section id="field-definition"><h2>字段定义</h2>
<p><code>poison_cap_step</code>：旧方案的每新增周目中毒上限增量，已取消。</p>
<p>取值来源：旧方案的运行时CFG，默认值100；现行规则不读取此配置。</p>
<p>换周目处理：配置不从角色状态继承。</p>
<p>从NG1起各周目中毒量的正常范围固定为0～99，不随周目增加；字段定义见<a href="use-poison-anti-poison-detoxification.zh-Hans.html#poison-field-definition">中毒、用毒、抗毒与解毒页</a>，上毒公式见<a href="use-poison-anti-poison-detoxification.zh-Hans.html#poison-application">中毒章“上毒”</a>。</p>
