<section id="field-definition"><h2>字段定义</h2>
<p><code>add_hp</code>：物品生命变化值。</p>
<p>取值来源：当前RANGER.GRP物品定义。</p>
<p>换周目处理：静态物品定义不从旧库存数量推算。</p>
<p>该值以生命点数为单位，物品使用与投掷按各自路径结算，不由旧库存数量决定。</p>
<p>正负回血分支、内伤折算、MAX HP增幅及投掷分档，统一见
<a href="hurt.zh-Hans.html#hurt-cap-impact-audit">伤势字段页</a>。</p>
<p>物品跨周目数量筛选另见
<a href="inventory-count.zh-Hans.html#item-inheritance">库存数量字段页</a>。</p>
</section>
