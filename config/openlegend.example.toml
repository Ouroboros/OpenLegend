[paths]

# 使用哪个 MOD 配置（相对路径以可执行文件目录为基准）。本文件只指定 MOD，
# 数据目录、存档目录、多周目（NG+）设置都写在 MOD 配置中，上次使用的存档槽也由程序
# 记在 MOD 配置里；本文件不接受 data_dir、save_dir、[new_game_plus] 与 [saves]。
# 未指定 mod 时使用程序内置的原版设定：数据目录为启动时的当前目录，存档写入数据目录，
# 不开启 NG+。
# 原版数据使用 config/mods/original.toml，其他 MOD 见 config/mods/。

# mod = './mods/original.toml'

[logging]

# 相对路径基于可执行文件目录解析。该路径提供文件名前缀和扩展名。每次启动
# 都会在其旁边写入独立的 PREFIX-YYYY-MM-DD_HH-MM-SS-{PID}.log 文件。
# 每条记录都会立即刷新。级别：trace、debug、info、warning、error、critical。
# 未配置 path 时，前缀取可执行文件名，例如 openlegend-release.exe 写入
# logs/openlegend-release-YYYY-MM-DD_HH-MM-SS-{PID}.log。

# path = "logs/openlegend.log"
level = "info"

[input]

# 姓名输入默认使用原版内建注音键盘。设为 "modern" 可改用 SDL／系统文字输入
# 与宿主输入法。姓名画面中可按 F12 在两种模式间切换，仅影响当前会话。

name_entry = "legacy"

# 原生平滑移动默认开启。设为 false 可恢复原版逐格移动；不会改变移动速度或存档。

smooth_movement = true

# 首次移动后，按住方向键开始连续移动前的延迟。
# 设为 0 表示立即连续移动。

movement_repeat_delay_ms = 500

# 菜单导航开始重复前的延迟，以及后续每次重复的间隔。
# 存档列表的 Page Up/Down 也使用这组参数。延迟必须非负，间隔必须为正数。

menu_repeat_delay_ms = 500
menu_repeat_interval_ms = 55

# 打开／关闭世界地图的按键，可写多个。可用：A～Z、0～9、Tab、F1～F10。
# 在大地图或场景中可用，战斗中无效。

world_map_keys = ["M", "Tab"]

[timing]

# FI/FO 调色板帧之间的延迟。默认值匹配 VGA mode 13h。
# 设为 0 表示淡变帧之间不等待。

fade_frame_delay_ms = 14.268

[window]

# 这些值只控制还原后的宿主窗口。完成的游戏画面会保持宽高比，尽量填满窗口，
# 比例不一致时居中留黑边。

width = 960
height = 600
maximized = false

[display]

# 游戏实际绘制的逻辑分辨率。增大该尺寸时，地图格、人物和物件保持原逻辑
# 像素大小，同时显示更多内容。scale 可设为 1.0..4.0，基于 320x200 分别
# 四舍五入计算宽高；存在 scale 时优先于 width 和 height。未配置 scale 时，
# 宽度范围为 320..1280，高度范围为 200..800，宽高必须同时提供或同时省略。

# scale = 1.5
width = 320
height = 200
