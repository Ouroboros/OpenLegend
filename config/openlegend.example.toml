[paths]

# 相对路径以可执行文件目录为基准。未配置 save_dir 时，编号存档仍按原逻辑
# 保存在 data_dir 中。

# data_dir = './data'
# save_dir = './save'

[new_game_plus]

# NG+ 默认关闭。只写 enabled = true 即可启用，其余字段省略时使用下列默认值。
# 配置文件须命名为 openlegend.toml 并放在可执行文件同目录；修改后重启游戏。
# 开启后从第一周目起保存为 TOML，通关后可保存通关进度，并在标题选择 New Game+。
# 关闭时使用原版存档流程，不读取 NG+ TOML 存档。

enabled = false

# 最大允许周目序号，第一周目为 1；默认允许到第 999 周目。
# 这是周目数量限制，不是人物等级或武功等级上限。
maximum_playthroughs = 999

# 内伤上限固定为 99，不随周目变化；受伤后的内伤增量按目标最大生命与最大内力计算。
# 旧版 hurt_cap_step 已取消，写入该键会导致配置加载失败。

# 敌方属性按原始资产基准值 + (当前周目 - 1) * 对应 STEP 计算。
# 以下字段名虽然包含 cap，但不会按周目限制我方永久属性，
# 也不会在继承时自动给我方增加属性。生命／内力 STEP 增加的是最大值。
# 敌方当前生命／内力仍取原始基准值，不因最大值增长自动补满。

# 敌方最大生命每周目增加量。
hp_cap_step = 999
# 敌方最大内力每周目增加量。
mp_cap_step = 999
# 敌方攻击每周目增加量。
attack_cap_step = 100
# 敌方防御每周目增加量。
defence_cap_step = 100
# 敌方用毒能力每周目增加量。
use_poison_cap_step = 100
# 敌方抗毒能力每周目增加量。
anti_poison_cap_step = 100
# 敌方暗器能力每周目增加量。
hidden_weapon_cap_step = 100
# 敌方人物等级每周目增加量；不限制我方可练到的等级。
role_level_step = 30

# 敌方已学武功每周目增加的等级单位，每单位对应 100 点熟练度。
# 默认每周目在原始熟练度基础上累加 1000 点；不创建新武功，不限制我方武功等级。
martial_level_step = 10

# 战斗经验按百分比计算：第一周目固定为 100%，第二周目使用此值。
battle_experience_percent_ng2 = 150
# 从第三周目起，每周目增加的经验倍率百分点。
# 默认第二／三／四周目分别为 150%／250%／350%，不是每次乘以 100%。
battle_experience_percent_step = 100

# 完整规则见 docs/new-game-plus-design.zh-Hans.html 及其引用的字段页。

[logging]

# 相对路径基于可执行文件目录解析。该路径提供文件名前缀和扩展名。每次启动
# 都会在其旁边写入独立的 PREFIX-YYYY-MM-DD_HH-MM-SS-{PID}.log 文件。
# 每条记录都会立即刷新。级别：trace、debug、info、warning、error、critical。
# 未配置 path 时，前缀取可执行文件名，例如 openlegend-release.exe 写入
# logs/openlegend-release-YYYY-MM-DD_HH-MM-SS-{PID}.log。

# path = "logs/openlegend.log"
level = "info"

[input]

# 姓名输入默认使用原版内建注音键盘。设为 "modern" 可改用 SDL／系统文字输入
# 与宿主输入法。姓名画面中可按 F12 在两种模式间切换，仅影响当前会话。

name_entry = "legacy"

# 原生平滑移动默认开启。设为 false 可恢复原版逐格移动；不会改变移动速度或存档。

smooth_movement = true

# 首次移动后，按住方向键开始连续移动前的延迟。
# 设为 0 表示立即连续移动。

movement_repeat_delay_ms = 500

# 菜单导航开始重复前的延迟，以及后续每次重复的间隔。
# 存档列表的 Page Up/Down 也使用这组参数。延迟必须非负，间隔必须为正数。

menu_repeat_delay_ms = 500
menu_repeat_interval_ms = 55

# 打开／关闭世界地图的按键，可写多个。可用：A～Z、0～9、Tab、F1～F10。
# 在大地图或场景中可用，战斗中无效。

world_map_keys = ["M", "Tab"]

[timing]

# FI/FO 调色板帧之间的延迟。默认值匹配 VGA mode 13h。
# 设为 0 表示淡变帧之间不等待。

fade_frame_delay_ms = 14.268

[window]

# 这些值只控制还原后的宿主窗口。完成的游戏画面会保持宽高比，尽量填满窗口，
# 比例不一致时居中留黑边。

width = 960
height = 600
maximized = false

[display]

# 游戏实际绘制的逻辑分辨率。增大该尺寸时，地图格、人物和物件保持原逻辑
# 像素大小，同时显示更多内容。scale 可设为 1.0..4.0，基于 320x200 分别
# 四舍五入计算宽高；存在 scale 时优先于 width 和 height。未配置 scale 时，
# 宽度范围为 320..1280，高度范围为 200..800，宽高必须同时提供或同时省略。

# scale = 1.5
width = 320
height = 200

[saves]

# 最近一次存档或读档的槽位，游戏会自动更新；打开存档或读档列表时
# 光标会定位到这个槽位。缺省或非法时从第一格开始。

# last_slot = 0
