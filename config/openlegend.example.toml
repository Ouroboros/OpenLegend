[paths]

# Windows paths can use TOML literal strings, so backslashes need no escaping.
# data_dir = 'E:\Game\金庸群侠传'

# Linux and macOS example:
# data_dir = '/home/user/games/jinyong'

[logging]

# Relative paths resolve from the executable directory. The path supplies the
# PREFIX and extension; every launch writes a separate
# PREFIX-YYYY-MM-DD_HH-MM-SS-{PID}.log file beside it. Every record is flushed
# immediately. Levels: trace, debug, info, warning, error, critical.
path = "logs/openlegend.log"
level = "info"

[input]

# Delay after the first movement before a held direction starts repeating.
# Use 0 for immediate continuous movement.
movement_repeat_delay_ms = 500

[timing]

# Delay between FI/FO palette frames. The default matches VGA mode 13h.
# Use 0 to present fade frames without waiting.
fade_frame_delay_ms = 14.268

[window]

# OpenLegend always renders internally at 320x200. These values only control
# the restored host window; game content keeps its original aspect ratio.
width = 960
height = 600
maximized = false
