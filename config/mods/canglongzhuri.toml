# OpenLegend MOD 配置：苍龙逐日
#
# 在 openlegend.toml 中指定：
#   [paths]
#   mod = './mods/canglongzhuri.toml'
# 未指定 mod 时使用程序内置的原版设定，不开启多周目（NG+）。
#
# 格式（format = 1）：
#   format  配置格式版本，必须为 1
#   name    MOD 名称，用于日志
#   [paths] 可选，相对路径以可执行文件目录为基准
#     data_dir  数据目录；未写时为启动时的当前目录
#     save_dir  存档目录；未写时为 save/<本文件名去掉扩展名>
#   [new_game_plus] 可选，多周目设置，字段说明见 config/mods/original.toml；未写时不开启
#   本文件由程序只读。上次存档槽按 MOD 配置路径分别记在 openlegend.default.toml。
#   旧版 [saves] last_slot 会在程序文件尚无该 MOD 记录时导入一次，旧文件保持原样。
#   [[merge]] 可选，合战规则，字段说明见 config/mods/original.toml
#   [files] 可选，按编号打开的资源文件名表；第 n 项为编号 n 的文件名，文件名相对 data_dir。
#           未列出的表使用原版命名，编号超出所列项数时报错。
#     scene_sprite_index  场景贴图索引，原版 SDXnnn
#     scene_sprite_group  场景贴图，原版 SMPnnn
#     battlefield_index   战场贴图索引，原版 WDXnnn
#     battlefield_group   战场贴图，原版 WMPnnn
#     fight_index         战斗动画索引，原版 FIGHTnnn.IDX
#     fight_group         战斗动画，原版 FIGHTnnn.GRP
#   出现其他字段时整个配置不生效并报错。
#
# [files] 各表取自该 MOD 的 Z.DAT 文件名表（文件偏移 320892 起），游戏运行时不读 Z.DAT。

format = 1
name = "苍龙逐日"

# 按本机安装位置填写。
[paths]
# data_dir = 'E:\Game\canglongzhuri'
# save_dir = './save/canglongzhuri'

# 多周目设置，字段说明见 config/mods/original.toml。
[new_game_plus]
enabled = false

[files]

